name: Build & release

on:
  push:
    branches: [main]
    paths-ignore:
      - 'manifest.json'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Build (against Jellyfin.Controller from NuGet)
        run: dotnet build Jellyfin.Plugin.ReleaseDateAdded/Jellyfin.Plugin.ReleaseDateAdded.csproj -c Release -o out

      - name: Is this version already released?
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(sed -nE 's/^version: *"?([^"]+)"?.*/\1/p' build.yaml)
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::v$VERSION is already released. Bump the version in build.yaml, meta.json and the .csproj to release a new one."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Package
        if: steps.check.outputs.exists == 'false'
        id: pkg
        run: |
          VERSION=$(sed -nE 's/^version: *"?([^"]+)"?.*/\1/p' build.yaml)
          TARGET_ABI=$(sed -nE 's/^targetAbi: *"?([^"]+)"?.*/\1/p' build.yaml)
          ZIP="imdb-air-date-fixer_${VERSION}.zip"
          mkdir -p pkg
          cp out/Jellyfin.Plugin.ReleaseDateAdded.dll meta.json pkg/
          (cd pkg && zip -X -q "../$ZIP" ./*)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "targetAbi=$TARGET_ABI" >> "$GITHUB_OUTPUT"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          echo "md5=$(md5sum "$ZIP" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: GitHub release
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.pkg.outputs.version }}
          ZIP: ${{ steps.pkg.outputs.zip }}
        run: gh release create "$TAG" "$ZIP" --title "IMDb Air Date Fixer $TAG" --notes "Built automatically against Jellyfin 12.x."

      - name: Update manifest.json
        if: steps.check.outputs.exists == 'false'
        env:
          VERSION: ${{ steps.pkg.outputs.version }}
          TARGET_ABI: ${{ steps.pkg.outputs.targetAbi }}
          ZIP: ${{ steps.pkg.outputs.zip }}
          MD5: ${{ steps.pkg.outputs.md5 }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json, os, datetime
          meta = json.load(open("meta.json", encoding="utf-8"))
          v = os.environ
          # Keep earlier versions so clients with a cached catalog page can still install.
          previous = []
          if os.path.exists("manifest.json"):
              try:
                  previous = json.load(open("manifest.json", encoding="utf-8"))[0].get("versions", [])
              except Exception:
                  previous = []
          versions = [x for x in previous if x.get("version") != v["VERSION"]]
          versions.append({
              "version": v["VERSION"],
              "changelog": meta["changelog"],
              "targetAbi": v["TARGET_ABI"],
              "sourceUrl": f"https://github.com/{v['REPO']}/releases/download/v{v['VERSION']}/{v['ZIP']}",
              "checksum": v["MD5"],
              "timestamp": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
          })
          versions.sort(key=lambda x: tuple(int(p) for p in x["version"].split(".")), reverse=True)
          manifest = [{
              "guid": meta["guid"],
              "name": meta["name"],
              "description": meta["description"],
              "overview": meta["overview"],
              "owner": meta["owner"],
              "category": meta["category"],
              "imageUrl": "",
              "versions": versions,
          }]
          with open("manifest.json", "w", encoding="utf-8") as f:
              json.dump(manifest, f, ensure_ascii=False, indent=2)
              f.write("\n")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "Update manifest.json for v${VERSION} [skip ci]"
            git push
          fi
